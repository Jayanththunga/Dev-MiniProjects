<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackers Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #btn-container {
            margin-top: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #btn {
            padding: 13px;
            border: none;
            background-color: rgb(21, 21, 21);
            color: aliceblue;
            cursor: pointer;
            font-size: 20px;
        }

        #terminal-head {
            font-size: 30px;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            color: #33ff33;
        }

        .hack-content{
            color: #33ff33;
            margin-left: 10px;
            font-size: 18px;
        }

    </style>
</head>

<body>
    <div id="terminal-head">
        <h1 hidden>Lets Go!</h1>
    </div>

    <div id="btn-container">
        <button type="button" id="btn">Click To Download</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
